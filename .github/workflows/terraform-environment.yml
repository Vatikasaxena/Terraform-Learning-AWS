name: Terraform Multi Environment CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-environment-deploy
  cancel-in-progress: false

jobs:

  # ============================================================
  # DEV
  # ============================================================
  terraform-dev:

    name: DEV Deploy
    runs-on: ubuntu-latest

    environment:
      name: dev

    defaults:
      run:
        working-directory: terraform-environment-practice/environments/dev

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::834107150638:role/Terraform-CICD
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve


  # ============================================================
  # UAT
  # ============================================================
  terraform-uat:

    name: UAT Deploy
    runs-on: ubuntu-latest

    needs:
      - terraform-dev

    environment:
      name: uat

    defaults:
      run:
        working-directory: terraform-environment-practice/environments/uat

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::834107150638:role/Terraform-CICD
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve


  # ============================================================
  # PROD
  # ============================================================
  terraform-prod:

    name: PROD Deploy
    runs-on: ubuntu-latest

    needs:
      - terraform-uat

    environment:
      name: prod

    defaults:
      run:
        working-directory: terraform-environment-practice/environments/prod

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::834107150638:role/Terraform-CICD
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve